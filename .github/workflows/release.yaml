name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: puniyu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release:
    if: "!startsWith(github.head_ref, 'release')"
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release-plz.outputs.prs_created }}
      core: ${{ steps.release-plz.outputs.core }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: 获取token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 设置 rust
        uses: puniyu/setup-rust@5bef47975285e477b672ce87764f851fbb5fd6ab # main
        with:
          target: ${{ matrix.platform.target }}
          cache: true
          prefix-key: "release"

      - name: 运行 release
        if: ${{ github.ref_name == 'main' }}
        run: |
          cargo run --bin release -- release --git-token ${{ steps.app-token.outputs.token }}

      - name: 运行 release-pr
        run: |
          cargo run --bin release -- release-pr --git-token ${{ steps.app-token.outputs.token }}
      

