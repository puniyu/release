name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: puniyu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release:
    if: "!startsWith(github.head_ref, 'release')"
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release-plz.outputs.prs_created }}
      core: ${{ steps.release-plz.outputs.core }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: 获取token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 设置 rust
        uses: puniyu/setup-rust@193e89f6f2587e5ded12957d6b786ddffe3ccce1 # main
        with:
          target: ${{ matrix.platform.target }}
          cache: true
          prefix-key: "release"

      - name: 运行 release
        if: ${{ github.ref_name == 'main' }}
        run: |
          cargo run --bin release -- release --git-token ${{ steps.app-token.outputs.token }}

      - name: 运行 release-pr
        run: |
          cargo run --bin release -- release-pr --git-token ${{ steps.app-token.outputs.token }}
      

